<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trimmed | Book an Appointment</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar sticky-top bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand brand" href="#">Trimmed</a>
    <button class="btn btn-outline-dark" data-bs-toggle="offcanvas" data-bs-target="#mine">My bookings <span id="mineCount" class="badge text-bg-dark">0</span></button>
  </div>
</nav>

<header class="container hero">
  <h1>Book your chair.</h1>
  <p class="lead">Open Monday to Saturday, 9 AM to 5 PM. Pick a service, a barber and a time.</p>
</header>

<main class="container pb-5">
  <div class="row g-4">
    <div class="col-lg-8">
      <ol id="steps" class="steps list-unstyled d-flex gap-2 mb-3" aria-label="Progress"></ol>
      <section id="panel" class="panel" aria-live="polite"></section>
    </div>
    <aside class="col-lg-4"><div id="summary" class="panel sticky-lg-top summary"></div></aside>
  </div>
</main>

<div class="offcanvas offcanvas-end" id="mine" tabindex="-1" aria-labelledby="mineTitle">
  <div class="offcanvas-header"><h2 id="mineTitle" class="h5 m-0">My bookings</h2><button class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button></div>
  <div class="offcanvas-body" id="mineList"></div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-dark" role="status" aria-live="polite"><div class="toast-body" id="toastMsg"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
